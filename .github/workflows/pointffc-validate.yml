name: POINT FFC — Validate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pointffc-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Testes, lint, typecheck e build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 e cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências travadas
        run: npm ci

      - name: Configurar ambiente de validação
        env:
          POINTFFC_ENV_FILE: ${{ secrets.POINTFFC_ENV_FILE }}
        run: |
          if [ -z "$POINTFFC_ENV_FILE" ]; then
            echo "::error::POINTFFC_ENV_FILE não configurado"
            exit 1
          fi
          printf '%s\n' "$POINTFFC_ENV_FILE" > .env.local
          chmod 600 .env.local

      - name: Executar testes
        run: npm test

      - name: Executar lint
        run: npm run lint

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Validar configuração necessária para o build
        run: |
          node <<'NODE'
          const { loadEnvConfig } = require("@next/env");
          loadEnvConfig(process.cwd(), false);

          const required = [
            "NEXT_PUBLIC_FIREBASE_API_KEY",
            "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN",
            "NEXT_PUBLIC_FIREBASE_PROJECT_ID",
            "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET",
            "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID",
            "NEXT_PUBLIC_FIREBASE_APP_ID",
            "NEXT_PUBLIC_API_URL",
            "NEXT_PUBLIC_CARTOLA_SEASON",
            "NEXT_PUBLIC_CARTOLA_ROUND",
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) {
            console.error(`Build não executado: variáveis ausentes em POINTFFC_ENV_FILE: ${missing.join(", ")}`);
            process.exit(1);
          }

          if (process.env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN !== "pointffc.com.br") {
            console.error("Build não executado: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN precisa corresponder ao domínio validado do POINT FFC.");
            process.exit(1);
          }

          let apiUrl;
          try {
            apiUrl = new URL(process.env.NEXT_PUBLIC_API_URL);
          } catch {
            console.error("Build não executado: NEXT_PUBLIC_API_URL precisa ser uma URL HTTPS pública.");
            process.exit(1);
          }
          if (apiUrl.protocol !== "https:" || ["localhost", "127.0.0.1", "[::1]"].includes(apiUrl.hostname)) {
            console.error("Build não executado: NEXT_PUBLIC_API_URL precisa ser uma URL HTTPS pública.");
            process.exit(1);
          }

          if (!/^[1-9][0-9]*$/.test(process.env.NEXT_PUBLIC_CARTOLA_SEASON) || !/^[1-9][0-9]*$/.test(process.env.NEXT_PUBLIC_CARTOLA_ROUND)) {
            console.error("Build não executado: temporada e rodada precisam ser inteiros positivos.");
            process.exit(1);
          }
          NODE

      - name: Gerar build estático de produção
        run: npm run build
